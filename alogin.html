  <div id="continueBtn" class="continue-btn">Connecting to Internet in 5s...</div>
</div>

<script>
  var timeLeft = 5;
  var btn = document.getElementById('continueBtn');
  
  // Ibinalik natin yung target URL papunta sa Facebook page
  var targetUrl = 'https://www.facebook.com/profile.php?id=61576971935590';

  var timer = setInterval(function() {
    timeLeft--;
    if(timeLeft > 0) {
      btn.innerText = 'Connecting to Internet in ' + timeLeft + 's...';
    } else {
      clearInterval(timer);
      btn.innerText = 'Redirecting...';
      window.location.href = targetUrl;
    }
  }, 1000);

  btn.addEventListener('click', function() {
    clearInterval(timer);
    btn.innerText = 'Redirecting...';
    window.location.href = targetUrl;
  });
</script>
